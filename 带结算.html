<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓝牙打印测试 - YeYeKao</title>
</head>
<body style="text-align: center; padding-top: 50px;">
    <h2>蓝牙打印机连接测试</h2>
    <button id="connect" style="padding: 20px 40px; font-size: 18px; background: #32d74b; color: white; border: none; border-radius: 10px;">
        1. 连接打印机并打印测试页
    </button>
    <p id="status" style="margin-top: 20px; color: #666;">等待连接...</p>

    <script>
        document.getElementById('connect').addEventListener('click', async () => {
            const status = document.getElementById('status');
            try {
                status.innerText = "正在请求蓝牙权限...";
                // 搜索打印机
                const device = await navigator.bluetooth.requestDevice({
                    filters: [
                        { services: ['000018f0-0000-1000-8000-00805f9b34fb'] },
                        { namePrefix: 'TP' }, 
                        { namePrefix: 'Printer' }
                    ],
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
                });

                status.innerText = "正在连接设备...";
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                const characteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');

                status.innerText = "连接成功！正在发送测试指令...";
                
                // ESC/POS 测试指令：初始化 + 打印文字 + 换行
                const testData = '\x1B\x40' + 'YeYeKao Test OK!\n\n\n\n';
                const encoder = new TextEncoder();
                await characteristic.writeValue(encoder.encode(testData));

                status.innerText = "打印指令已发送！";
            } catch (error) {
                status.innerText = "错误: " + error.message;
                console.error(error);
            }
        });
    </script>
</body>
</html>
